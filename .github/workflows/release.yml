name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  release:
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - name: Prod manifest
        run: |
          URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}
          sed "s|https://localhost:3000|$URL|g" manifest.xml > manifest.prod.xml
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - uses: actions/deploy-pages@v4
        id: deploy
      - run: cd dist && zip -r ../legal-anonymiser-${{ github.ref_name }}.zip .
      - name: Sign release manifest (SHA256SUMS)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "secret RELEASE_SIGNING_KEY missing (see scripts/keygen.mjs)"; exit 1; }
          sha256sum manifest.prod.xml legal-anonymiser-${{ github.ref_name }}.zip scripts/install.sh scripts/install.ps1 | sed 's| scripts/| |' > SHA256SUMS
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" -out SHA256SUMS.sig SHA256SUMS
          # the signature must verify against the key pinned in the installer, not just the secret we signed with
          sed -n "/BEGIN PUBLIC KEY/,/END PUBLIC KEY/p" scripts/install.sh > "$RUNNER_TEMP/pub.pem"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/pub.pem" -signature SHA256SUMS.sig SHA256SUMS
          rm -f "$RUNNER_TEMP/key.pem"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            legal-anonymiser-${{ github.ref_name }}.zip
            manifest.prod.xml
            SHA256SUMS
            SHA256SUMS.sig
            scripts/install.sh
            scripts/install.ps1
